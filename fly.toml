app = "trainpilot"
primary_region = "ams"

[build]

[env]
  PORT = "3000"
  SQLITE_PATH = "/data/strava-coach.db"
  STORAGE_BACKEND = "sqlite"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

[[mounts]]
  source = "trainpilot_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
